name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  deploy:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Generate .env from GitHub Secrets
        run: |
          {
            echo "ASPNETCORE_ENVIRONMENT=${{ secrets.ASPNETCORE_ENVIRONMENT }}"
            echo "CORS_ALLOWED_ORIGIN=${{ secrets.CORS_ALLOWED_ORIGIN }}"
            echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}"
            echo "ECS_CLUSTER=${{ secrets.ECS_CLUSTER }}"
            echo "ECS_SERVICE=${{ secrets.ECS_SERVICE }}"
          } > infrastructure/.env

          # Export to GitHub Actions environment for subsequent steps
          cat infrastructure/.env >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update ECS task definition and register new revision
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          aws ecs describe-task-definition \
            --task-definition investment-tracker-api \
            --query taskDefinition \
            --region $AWS_REGION | \
          jq --arg IMAGE       "$IMAGE_URI" \
             --arg DOTNET_ENV  "$ASPNETCORE_ENVIRONMENT" \
             --arg CORS_ORIGIN "$CORS_ALLOWED_ORIGIN" \
             --arg SECRET_ARN  "${{ secrets.DB_SECRET_ARN }}" \
             --arg ROLE_ARN    "${{ secrets.ECS_TASK_EXECUTION_ROLE_ARN }}" \
             '
               .containerDefinitions[0].image = $IMAGE |
               .executionRoleArn = $ROLE_ARN |
               .containerDefinitions[0].environment = (
                 .containerDefinitions[0].environment | map(
                   if .name == "ASPNETCORE_ENVIRONMENT" then .value = $DOTNET_ENV
                   elif .name == "Cors__AllowedOrigin"  then .value = $CORS_ORIGIN
                   else .
                   end
                 )
               ) |
               .containerDefinitions[0].secrets = (
                 .containerDefinitions[0].secrets | map(
                   if .name == "ConnectionStrings__DefaultConnection" then .valueFrom = $SECRET_ARN
                   else .
                   end
                 )
               ) |
               del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                   .placementConstraints, .compatibilities, .registeredAt, .registeredBy)
             ' > task-definition.json

          aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --region $AWS_REGION

      - name: Deploy to ECS Fargate
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition investment-tracker-api \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Wait for deployment to stabilize
        run: |
          MAX_WAIT=900
          INTERVAL=20
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            SVC=$(aws ecs describe-services \
              --cluster $ECS_CLUSTER --services $ECS_SERVICE \
              --region $AWS_REGION \
              --query 'services[0].{running:runningCount,desired:desiredCount,pending:pendingCount,deployments:length(deployments)}' \
              --output json)

            RUNNING=$(echo "$SVC" | jq -r '.running')
            DESIRED=$(echo "$SVC" | jq -r '.desired')
            PENDING=$(echo "$SVC" | jq -r '.pending')
            DEPLOYS=$(echo "$SVC" | jq -r '.deployments')

            echo "[${ELAPSED}s / ${MAX_WAIT}s] running=$RUNNING desired=$DESIRED pending=$PENDING active_deployments=$DEPLOYS"

            if [ "$RUNNING" = "$DESIRED" ] && [ "$PENDING" = "0" ] && [ "$DEPLOYS" = "1" ]; then
              echo "✅ Service is stable"
              break
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "❌ Service did not stabilize within ${MAX_WAIT}s"
            exit 1
          fi

      - name: Diagnose deployment failure
        if: failure()
        run: |
          echo "=== Service state ==="
          aws ecs describe-services \
            --cluster $ECS_CLUSTER --services $ECS_SERVICE \
            --region $AWS_REGION \
            --query 'services[0].{running:runningCount,desired:desiredCount,pending:pendingCount,events:events[:5]}' \
            --output json

          echo ""
          echo "=== Most recently stopped task ==="
          STOPPED_TASK=$(aws ecs list-tasks \
            --cluster $ECS_CLUSTER --service-name $ECS_SERVICE \
            --desired-status STOPPED \
            --query 'taskArns[0]' --output text --region $AWS_REGION)

          if [ -n "$STOPPED_TASK" ] && [ "$STOPPED_TASK" != "None" ]; then
            aws ecs describe-tasks \
              --cluster $ECS_CLUSTER --tasks $STOPPED_TASK \
              --region $AWS_REGION \
              --query 'tasks[0].{stoppedReason:stoppedReason,stoppedAt:stoppedAt,containers:containers[*].{name:name,exitCode:lastStatus,reason:reason}}' \
              --output json
          else
            echo "No stopped tasks found"
          fi

          echo ""
          echo "=== Latest CloudWatch logs ==="
          LOG_STREAM=$(aws logs describe-log-streams \
            --log-group-name /ecs/investment-tracker \
            --order-by LastEventTime --descending \
            --query 'logStreams[0].logStreamName' --output text --region $AWS_REGION 2>/dev/null)

          if [ -n "$LOG_STREAM" ] && [ "$LOG_STREAM" != "None" ]; then
            echo "Log stream: $LOG_STREAM"
            aws logs get-log-events \
              --log-group-name /ecs/investment-tracker \
              --log-stream-name "$LOG_STREAM" \
              --limit 50 --start-from-head false \
              --query 'events[*].message' --output text --region $AWS_REGION
          else
            echo "No log streams found in /ecs/investment-tracker"
          fi

      - name: Discover ECS task public IP
        id: app-url
        run: |
          TASK_ARN=$(aws ecs list-tasks \
            --cluster $ECS_CLUSTER \
            --service-name $ECS_SERVICE \
            --query 'taskArns[0]' --output text --region $AWS_REGION)

          ENI_ID=$(aws ecs describe-tasks \
            --cluster $ECS_CLUSTER \
            --tasks $TASK_ARN \
            --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value' \
            --output text --region $AWS_REGION)

          PUBLIC_IP=$(aws ec2 describe-network-interfaces \
            --network-interface-ids $ENI_ID \
            --query 'NetworkInterfaces[0].Association.PublicIp' \
            --output text --region $AWS_REGION)

          APP_URL="http://$PUBLIC_IP:8080"
          echo "app_url=$APP_URL" >> $GITHUB_OUTPUT
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

      - name: Health check
        run: |
          APP_URL="${{ steps.app-url.outputs.app_url }}"
          MAX_ATTEMPTS=12
          SLEEP_SECONDS=10
          HTTP_STATUS=""

          for i in $(seq 1 $MAX_ATTEMPTS); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$APP_URL/health" || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Health check passed on attempt $i (HTTP $HTTP_STATUS)"
              break
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: HTTP $HTTP_STATUS — waiting ${SLEEP_SECONDS}s..."
            sleep $SLEEP_SECONDS
          done

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Health check failed after $MAX_ATTEMPTS attempts (last status: $HTTP_STATUS)"
            exit 1
          fi

      - name: Print deployment summary
        if: success()
        run: |
          APP_URL="${{ steps.app-url.outputs.app_url }}"
          echo ""
          echo "=================================================="
          echo "  ✅ DEPLOYMENT SUCCESSFUL"
          echo "=================================================="
          echo "  Live API URL : $APP_URL"
          echo "  Health check : $APP_URL/health"
          echo "  Register     : $APP_URL/api/offices/register"
          echo "  Frontend     : ${{ secrets.CORS_ALLOWED_ORIGIN }}"
          echo "=================================================="
          echo ""
          echo "NOTE: Update frontend/config.js with the API URL:"
          echo "  window.APP_CONFIG = { apiUrl: '$APP_URL/api/offices/register' };"
          echo "Then re-sync to S3:"
          echo "  aws s3 sync frontend/ s3://investment-tracker-frontend-648548511587/"
